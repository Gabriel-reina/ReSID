[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymous-sid-retrieval"
version = "1.1.0"
description = "Reproducible long-tail SID retrieval with a shared generative backbone"
requires-python = ">=3.9"
dependencies = ["numpy>=1.26,<2", "torch>=2.8,<2.9"]
license = {text = "Apache-2.0 (code only; see README.md)"}

[project.optional-dependencies]
tokenizers = ["scikit-learn==1.6.1", "k-means-constrained==0.7.3"]

[tool.setuptools.packages.find]
include = ["sid_retrieval*", "third_party*"]

[tool.setuptools.package-data]
"third_party.minionerec" = ["LICENSE"]
